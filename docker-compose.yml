services:

  kafka:
    image: apache/kafka:4.1.1
    container_name: realtime-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo:8.0
    container_name: realtime-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: retail_analytics

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: realtime-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongodb:27017

    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  transaction-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-transaction-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongodb:27017
    command: >
      python -m src.streaming.transaction_consumer
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  transaction-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-transaction-producer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTION_TOPIC: transactions
      ONLINE_RETAIL_ARCHIVE: /app/data/raw/online+retail+ii.zip
    volumes:
      - ./data/raw:/app/data/raw:ro
    command: >
      python -m src.streaming.online_retail_producer
      --archive /app/data/raw/online+retail+ii.zip
      --flush-every 1000
      --log-every 10000
    depends_on:
      kafka:
        condition: service_healthy

  prediction-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-prediction-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGODB_URI: mongodb://mongodb:27017
    command: >
      python -m src.streaming.realtime_prediction_consumer
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    command: >
      streamlit run src/dashboard/app_professional.py
      --server.address=0.0.0.0
      --server.port=8501
    depends_on:
      api:
        condition: service_healthy
      
volumes:
  mongodb_data:
